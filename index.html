<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Speed Checker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{
    background:#fff;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    width:350px;
}

h1{
    margin-bottom:20px;
}

.speed{
    font-size:40px;
    font-weight:bold;
    color:#333;
    margin:20px 0;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#007bff;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}
</style>
</head>
<body>

<div class="container">
    <h1>Network Speed Checker</h1>

    <div class="speed" id="speed">0 Mbps</div>

    <button onclick="checkSpeed()">Check Speed</button>
</div>

<script>
async function checkSpeed() {

    const speedDisplay = document.getElementById("speed");
    speedDisplay.innerText = "Testing...";

    const imageAddr =
      "https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg";

    const downloadSize = 14679474; // bytes

    let startTime, endTime;

    const download = new Image();

    startTime = new Date().getTime();

    download.onload = function () {

        endTime = new Date().getTime();

        const duration = (endTime - startTime) / 1000;

        const bitsLoaded = downloadSize * 8;

        const speedBps = bitsLoaded / duration;

        const speedMbps = (speedBps / (1024 * 1024)).toFixed(2);

        speedDisplay.innerText = speedMbps + " Mbps";
    };

    download.onerror = function () {
        speedDisplay.innerText = "Error!";
    };

    download.src = imageAddr + "?nnn=" + startTime;
}
</script>

</body>
</html>
